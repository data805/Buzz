# Security headers for the Buzz server block. Included at server level, so
# do not add add_header inside a location without repeating these.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content Security Policy: the browser may talk only to this origin. This is
# the browser-side half of "no egress": it stops the Dograh UI from loading
# Chatwoot, PostHog, Google Tag Manager, Meta Pixel, Reo, or calling
# api.github.com (GitHubStarBadge) even if a build variable slips.
# 'unsafe-inline' is needed for Next.js inline scripts and the theme script
# in ui/src/app/layout.tsx. TURN/STUN (ICE) is not governed by CSP.
# (verify) in Phase 2: no CSP violations in the browser console on login,
# workflow editor, Test Audio, recordings and settings pages.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' wss://$host; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
