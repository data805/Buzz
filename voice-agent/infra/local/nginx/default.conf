# Local front for the prebuilt Dograh UI. Its job is to keep the browser on
# this machine: the official UI image bakes in Chatwoot, a leads form and
# analytics (PLAN F3). A strict Content-Security-Policy makes the browser
# refuse every address except localhost, and the call-home paths return 404.
server {
    listen 3010;
    server_name localhost;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: http://localhost:9000; connect-src 'self' http://localhost:8000 ws://localhost:8000 http://localhost:9000; frame-src 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/(ingest|monitoring|_buzz) { return 404; }
    location = /api/config/latest-version { default_type application/json; return 200 '{"latest":null}'; }

    location / {
        proxy_pass http://ui:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
