; Buzz dialplan (PLAN.md sections 1, 6 and 7; INTERFACES.md "Dial path" and "Transfer path").
;
; Environment values appear ONLY in [globals] below (envsubst with an explicit
; list). Everywhere else ${...} is an Asterisk variable. Dialplan names use the
; BUZZ_ prefix; environment names never do.
;
; Contexts
;   from-trunk          carrier calls in -> DID table -> buzz-inbound
;   buzz-staff          staff phones: may call agent DIDs and the echo test only
;   buzz-inbound        answer, play the disclosure (non-interruptible), hand to Dograh
;   buzz-stasis         the only place Stasis() is called
;   buzz-outbound       Dograh's Dial String Template target: Local/{number}@buzz-outbound/n
;   buzz-transfer       Dograh transfer target: Local/<ext>[*<topic>]@buzz-transfer/n
;   buzz-take-message   decline / no answer -> record a message, notify n8n
;   buzz-sub-*          subroutines (Gosub / Dial U())
;
; Hangup causes used (Dograh records them as ari_cause; its campaign retries
; only busy 17 and no-answer 18/19, so denials must never use those):
;   21 CALL_REJECTED            suppression service said DENY <reason>
;   41 NORMAL_TEMPORARY_FAILURE suppression service unreachable or bad reply (fail closed), or disclosure missing
;   29 FACILITY_REJECTED        outside permitted calling hours
;   34 NORMAL_CIRCUIT_CONGESTION trunk channel limit reached
;    1 UNALLOCATED              unknown DID / malformed destination

[general]
static = yes
writeprotect = yes
clearglobalvars = yes

[globals]
BUZZ_STASIS_APP=${DOGRAH_STASIS_APP}
BUZZ_SUPPRESSION_URL=${SUPPRESSION_URL}
BUZZ_SUPPRESSION_KEY=${SUPPRESSION_API_KEY}
BUZZ_TRUNK=zm-trunk
BUZZ_TRUNK_MAX=${ZM_TRUNK_MAX_CHANNELS}
BUZZ_TRUNK_FORMAT=${ZM_TRUNK_NUMBER_FORMAT}
BUZZ_OUTBOUND_CLI=${OUTBOUND_CLI}
BUZZ_OUTBOUND_RING=${OUTBOUND_RING_TIMEOUT}
BUZZ_TRANSFER_RING=${TRANSFER_RING_TIMEOUT}
BUZZ_TZ=${CALL_TIMEZONE}
BUZZ_WEBHOOK_URL=${MESSAGE_WEBHOOK_URL}
BUZZ_WEBHOOK_SECRET=${MESSAGE_WEBHOOK_SECRET}
BUZZ_SOUNDS=/var/lib/asterisk/sounds/buzz
BUZZ_MESSAGES_DIR=/var/spool/asterisk/buzz-messages

; Generated / operator-maintained includes (see entrypoint.sh and local.example/)
#include extensions_hours.conf
#include extensions_dids.conf
#include extensions_transfer_targets.conf

; ===========================================================================
; Inbound
; ===========================================================================

[from-trunk]
; Order matters: DIDs first, then the catch-all that rejects everything else.
include => buzz-inbound-dids
include => buzz-inbound-unknown

[buzz-inbound-unknown]
exten => _X.,1,Goto(reject,1)
exten => _+X.,1,Goto(reject,1)
exten => s,1,Goto(reject,1)
exten => reject,1,Log(NOTICE,Buzz inbound: no route for DID ${CALLERID(dnid)} (exten ${EXTEN}) from ${CALLERID(num)})
 same => n,Hangup(1)

[buzz-staff]
; Staff can ring an agent the same way a caller does (via the DID table),
; and use 600 as an echo test. No trunk access from staff phones.
include => buzz-inbound-dids
exten => 600,1,NoOp(Echo test for ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

[buzz-inbound]
; Entered by Goto from the DID table with BUZZ_AGENT_NUMBER set to the number
; registered as a phone number in Dograh's ARI configuration.
;
; Dograh treats a StasisStart as inbound only while the channel is still in
; state "Ring" (ari_manager.py _handle_event). Answering here to play the
; disclosure would make Dograh treat the call as an outbound leg and drop it.
; So: answer, play the disclosure, then Dial a Local channel whose ;2 half
; enters Stasis un-answered, with ${EXTEN} = BUZZ_AGENT_NUMBER (Dograh reads
; channel.dialplan.exten as called_number). /n stops Local optimisation so the
; channel Dograh tracks stays for the whole call.
exten => s,1,NoOp(Buzz inbound: DID ${CALLERID(dnid)} from ${CALLERID(num)} to agent ${BUZZ_AGENT_NUMBER})
 same => n,GotoIf(${REGEX("^[+]?[0-9]{2,15}$" ${BUZZ_AGENT_NUMBER})}?route_ok)
 same => n,Log(ERROR,Buzz inbound: DID table gave bad BUZZ_AGENT_NUMBER '${BUZZ_AGENT_NUMBER}')
 same => n,Hangup(1)
 same => n(route_ok),Set(GROUP(buzz)=trunk)
 same => n,Answer()
 same => n,Wait(0.5)
 ; Playback() ignores DTMF, so the disclosure cannot be skipped.
 same => n,Playback(${BUZZ_SOUNDS}/disclosure-inbound)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?disclosed)
 same => n,Log(ERROR,Buzz inbound: disclosure prompt failed to play - refusing the call)
 same => n,Hangup(41)
 same => n(disclosed),Dial(Local/${BUZZ_AGENT_NUMBER}@buzz-stasis/n)
 same => n,Verbose(1,Buzz inbound: agent leg ended DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 ; Dograh did not take the call (not running, no workflow for this number, quota).
 same => n,Playback(${BUZZ_SOUNDS}/service-unavailable)
 same => n(done),Hangup()

[buzz-stasis]
exten => _[+0-9].,1,NoOp(Buzz: handing ${EXTEN} from ${CALLERID(num)} to Dograh app ${BUZZ_STASIS_APP})
 same => n,Stasis(${BUZZ_STASIS_APP})
 same => n,Verbose(1,Buzz: Stasis returned STASISSTATUS=${STASISSTATUS} for ${EXTEN})
 same => n,Hangup()

; ===========================================================================
; Outbound guard (Deviation D4). Every Dograh outbound call - API, campaign
; or test - arrives here as Local/{number}@buzz-outbound/n.
;   1. CURL the suppression service: number rules + opt-out list (fail closed)
;   2. permitted calling hours (GotoIfTime, generated extensions_hours.conf)
;   3. trunk channel limit (GROUP_COUNT)
;   4. Dial the trunk; the callee hears the disclosure before the agent starts
; ===========================================================================

[buzz-outbound]
exten => _[+0-9].,1,NoOp(Buzz outbound: request to dial '${EXTEN}' from ${CHANNEL(name)})
 same => n,Set(BUZZ_RAW=${EXTEN})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 same => n,Set(CURLOPT(failurecodes)=400,401,403,404,405,422,429,500,502,503,504)
 same => n,Set(CURLOPT(httpheader)=X-API-Key: ${BUZZ_SUPPRESSION_KEY})
 same => n,Set(BUZZ_CHECK=${CURL(${BUZZ_SUPPRESSION_URL}/v1/dialplan/check?number=${URIENCODE(${BUZZ_RAW})})})
 same => n,Verbose(2,Buzz outbound: suppression check for '${BUZZ_RAW}' returned '${BUZZ_CHECK}')
 same => n,GotoIf(${REGEX("^ALLOW [+][1-9][0-9]{6,14}$" ${BUZZ_CHECK})}?allowed)
 same => n,GotoIf(${REGEX("^DENY [a-z_]+$" ${BUZZ_CHECK})}?denied)
 ; Empty, error, timeout, HTTP failure code or anything unexpected: fail closed.
 same => n,Log(WARNING,Buzz outbound: suppression service gave no usable answer for '${BUZZ_RAW}' ('${BUZZ_CHECK}') - not dialling)
 same => n,Set(BUZZ_OUTCOME=check_error)
 same => n,Hangup(41)
 same => n(denied),Set(BUZZ_OUTCOME=deny_${BUZZ_CHECK:5})
 same => n,Log(NOTICE,Buzz outbound: '${BUZZ_RAW}' denied by suppression service: ${BUZZ_CHECK:5})
 same => n,Hangup(21)
 same => n(allowed),Set(BUZZ_E164=${BUZZ_CHECK:6})
 same => n,Gosub(buzz-sub-hours,s,1)
 same => n,GotoIf($["${GOSUB_RETVAL}" = "open"]?in_hours)
 same => n,Set(BUZZ_OUTCOME=outside_hours)
 same => n,Log(NOTICE,Buzz outbound: ${BUZZ_E164} refused, outside permitted calling hours (${BUZZ_TZ}))
 same => n,Hangup(29)
 same => n(in_hours),Set(GROUP(buzz)=trunk)
 same => n,GotoIf($[${GROUP_COUNT(trunk@buzz)} <= ${BUZZ_TRUNK_MAX}]?have_channel)
 same => n,Set(BUZZ_OUTCOME=channel_limit)
 same => n,Log(NOTICE,Buzz outbound: ${BUZZ_E164} refused, trunk limit reached (${GROUP_COUNT(trunk@buzz)}/${BUZZ_TRUNK_MAX} incl. this call))
 same => n,Hangup(34)
 same => n(have_channel),Gosub(buzz-sub-trunk-number,s,1(${BUZZ_E164}))
 same => n,Set(BUZZ_DIAL_NUM=${GOSUB_RETVAL})
 same => n,GotoIf($["${BUZZ_OUTBOUND_CLI}" = ""]?dial)
 same => n,Set(CALLERID(num)=${BUZZ_OUTBOUND_CLI})
 same => n(dial),Set(BUZZ_OUTCOME=dialled)
 same => n,Verbose(1,Buzz outbound: dialling ${BUZZ_E164} as ${BUZZ_DIAL_NUM} on ${BUZZ_TRUNK} (CLI ${CALLERID(num)}))
 ; U(): the disclosure plays to the callee after they answer and before this
 ; leg is answered, so Dograh's agent starts only once the disclosure is done.
 same => n,Dial(PJSIP/${BUZZ_DIAL_NUM}@${BUZZ_TRUNK},${BUZZ_OUTBOUND_RING},U(buzz-sub-callee-disclosure))
 same => n,Verbose(1,Buzz outbound: ${BUZZ_E164} DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 ; Pass a clear cause back through the Local channel to Dograh.
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?normal)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?noanswer)
 same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?congestion)
 same => n,Hangup(${IF($["${HANGUPCAUSE}" = ""]?41:${HANGUPCAUSE})})
 same => n(normal),Hangup(16)
 same => n(busy),Hangup(17)
 same => n(noanswer),Hangup(19)
 same => n(congestion),Hangup(34)

[buzz-sub-trunk-number]
; ARG1 = E.164 from the suppression service (always +260... for allowed calls).
; Returns the number in the format the carrier expects (ZM_TRUNK_NUMBER_FORMAT).
exten => s,1,GotoIf($["${BUZZ_TRUNK_FORMAT}" = "international"]?intl)
 same => n,GotoIf($["${BUZZ_TRUNK_FORMAT}" = "national"]?national)
 same => n,Return(${ARG1})
 same => n(intl),Return(${ARG1:1})
 ; +260 97 1234567 -> 097 1234567
 same => n(national),Return(0${ARG1:4})

[buzz-sub-callee-disclosure]
; Runs on the called (trunk) channel after answer, via Dial U().
exten => s,1,NoOp(Buzz outbound: playing disclosure to callee)
 same => n,Wait(0.3)
 same => n,Playback(${BUZZ_SOUNDS}/disclosure-outbound)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?ok)
 same => n,Log(ERROR,Buzz outbound: disclosure prompt failed to play - aborting call)
 same => n,Set(GOSUB_RESULT=ABORT)
 same => n,Return(no_disclosure)
 same => n(ok),Return(disclosed)

; ===========================================================================
; Transfers (Deviation D5, PLAN.md section 1)
;
; Dograh's ARI transfer originates the tool's destination into its Stasis app
; with appArgs "transfer,<id>" and nothing else (providers/ari/provider.py
; transfer_call). It treats the transfer as successful when that channel is
; answered. The transfer reason (custom_message) is spoken to the caller only,
; it never reaches Asterisk. So the destination string itself carries an
; optional topic token: Local/1001*events@buzz-transfer/n plays
; transfer-topic-events to staff before asking them to accept.
;
; This leg stays un-answered while staff are screened, so the caller keeps
; hearing Dograh's hold music. Accept -> Dial bridges -> Dograh bridges the
; caller. Decline / no answer -> this leg answers and takes a message.
; ===========================================================================

[buzz-transfer]
exten => _X.,1,NoOp(Buzz transfer: request '${EXTEN}')
 same => n,Set(BUZZ_EXT=${CUT(EXTEN,*,1)})
 same => n,Set(BUZZ_TOPIC=${CUT(EXTEN,*,2)})
 same => n,GotoIf(${REGEX("^[0-9]{2,8}$" ${BUZZ_EXT})}?ext_ok)
 same => n,Log(WARNING,Buzz transfer: bad extension in '${EXTEN}')
 same => n,Hangup(1)
 same => n(ext_ok),GotoIf($["${BUZZ_TOPIC}" = ""]?topic_ok)
 same => n,GotoIf(${REGEX("^[a-z0-9_]{1,32}$" ${BUZZ_TOPIC})}?topic_ok)
 same => n,Log(NOTICE,Buzz transfer: ignoring malformed topic '${BUZZ_TOPIC}')
 same => n,Set(BUZZ_TOPIC=)
 same => n(topic_ok),Set(BUZZ_TARGET=PJSIP/${BUZZ_EXT})
 ; Optional override (ring groups, a staff mobile, etc.) in extensions_transfer_targets.conf
 same => n,GotoIf(${DIALPLAN_EXISTS(buzz-transfer-targets,${BUZZ_EXT},1)}?:dial)
 same => n,Gosub(buzz-transfer-targets,${BUZZ_EXT},1)
 same => n(dial),Set(CALLERID(name)=Buzz AI desk)
 same => n,Set(GOSUB_RETVAL=)
 same => n,Verbose(1,Buzz transfer: ringing ${BUZZ_TARGET} for ${BUZZ_TRANSFER_RING}s, topic '${BUZZ_TOPIC}')
 same => n,Dial(${BUZZ_TARGET},${BUZZ_TRANSFER_RING},U(buzz-sub-transfer-screen^${BUZZ_TOPIC}))
 same => n,Set(BUZZ_SCREEN=${GOSUB_RETVAL})
 same => n,Verbose(1,Buzz transfer: ${BUZZ_EXT} DIALSTATUS=${DIALSTATUS} screen=${BUZZ_SCREEN})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER" & "${BUZZ_SCREEN}" = "accepted"]?done)
 same => n,Goto(buzz-take-message,s,1)
 same => n(done),Hangup(16)

[buzz-sub-transfer-screen]
; Runs on the staff channel after they pick up (Dial U()). Only staff hear it.
; ARG1 = topic token (may be empty). Press 1 to accept; anything else, or
; nothing after two tries, declines.
exten => s,1,NoOp(Buzz transfer: screening staff, topic '${ARG1}')
 same => n,Wait(0.5)
 same => n,Playback(${BUZZ_SOUNDS}/transfer-intro)
 same => n,GotoIf($["${ARG1}" = ""]?ask)
 same => n,Playback(${BUZZ_SOUNDS}/transfer-topic-${ARG1})
 same => n(ask),Read(BUZZ_ACCEPT,${BUZZ_SOUNDS}/transfer-press-1,1,,2,6)
 same => n,GotoIf($["${BUZZ_ACCEPT}" = "1"]?accept)
 same => n,Verbose(1,Buzz transfer: staff declined (input '${BUZZ_ACCEPT}'))
 same => n,Playback(${BUZZ_SOUNDS}/transfer-declined-staff)
 same => n,Set(GOSUB_RESULT=CONTINUE)
 same => n,Return(declined)
 same => n(accept),Verbose(1,Buzz transfer: staff accepted)
 same => n,Return(accepted)

[buzz-take-message]
; Answering this leg is what Dograh sees as "transfer answered": it stops hold
; music and bridges the caller here, so wait a moment before speaking.
exten => s,1,NoOp(Buzz transfer: taking a message for ${BUZZ_EXT})
 same => n,Set(BUZZ_MSG_ID=${STRFTIME(${EPOCH},${BUZZ_TZ},%Y%m%d-%H%M%S)}-${BUZZ_EXT}-${UNIQUEID})
 same => n,Set(BUZZ_MSG_FILE=${BUZZ_MESSAGES_DIR}/${BUZZ_MSG_ID})
 same => n,Set(CHANNEL(hangup_handler_push)=buzz-sub-message-webhook,s,1)
 same => n,Answer()
 same => n,Wait(1.5)
 same => n,Playback(${BUZZ_SOUNDS}/transfer-leave-message)
 ; 5 s of silence or # ends it; 120 s maximum; k keeps the file if the caller hangs up.
 same => n,Record(${BUZZ_MSG_FILE}.wav,5,120,k)
 same => n,Playback(${BUZZ_SOUNDS}/transfer-message-thanks)
 same => n,Hangup(16)

[buzz-sub-message-webhook]
; Hangup handler: tells n8n a message exists. Stub contract:
; POST form fields event, message_id, extension, topic, file, size_bytes,
; record_status, connected_number, at (epoch). Header X-Buzz-Webhook-Secret.
exten => s,1,NoOp(Buzz message ${BUZZ_MSG_ID}: webhook)
 same => n,Set(BUZZ_MSG_SIZE=${IF(${STAT(e,${BUZZ_MSG_FILE}.wav)}?${STAT(s,${BUZZ_MSG_FILE}.wav)}:0)})
 same => n,Log(NOTICE,Buzz message ${BUZZ_MSG_ID} for ${BUZZ_EXT}: ${BUZZ_MSG_SIZE} bytes, RECORD_STATUS=${RECORD_STATUS})
 same => n,GotoIf($["${BUZZ_WEBHOOK_URL}" = ""]?skip)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/x-www-form-urlencoded)
 same => n,Set(CURLOPT(httpheader)=X-Buzz-Webhook-Secret: ${BUZZ_WEBHOOK_SECRET})
 same => n,Set(BUZZ_POST=event=buzz.message&message_id=${URIENCODE(${BUZZ_MSG_ID})}&extension=${URIENCODE(${BUZZ_EXT})}&topic=${URIENCODE(${BUZZ_TOPIC})})
 same => n,Set(BUZZ_POST=${BUZZ_POST}&file=${URIENCODE(${BUZZ_MSG_FILE}.wav)}&size_bytes=${BUZZ_MSG_SIZE}&record_status=${URIENCODE(${RECORD_STATUS})})
 same => n,Set(BUZZ_POST=${BUZZ_POST}&connected_number=${URIENCODE(${CONNECTEDLINE(num)})}&at=${EPOCH})
 same => n,Set(BUZZ_WEBHOOK_REPLY=${CURL(${BUZZ_WEBHOOK_URL},${BUZZ_POST})})
 same => n,Verbose(2,Buzz message ${BUZZ_MSG_ID}: webhook reply '${BUZZ_WEBHOOK_REPLY}')
 same => n(skip),Return()
