; Buzz Asterisk modules.
;
; The image is built with only the modules in ../modules.list (see Dockerfile),
; so autoload loads exactly that set. The noload lines below are a second
; guard: if someone later widens the build, these stay off.
[modules]
autoload = yes

; Dangerous or unused interfaces
noload => app_system.so
noload => func_shell.so
noload => res_agi.so
noload => app_originate.so
noload => res_ari_mailboxes.so
noload => res_stasis_mailbox.so
noload => pbx_lua.so
noload => pbx_ael.so
noload => pbx_dundi.so
noload => pbx_realtime.so
noload => res_config_odbc.so
noload => res_odbc.so

; Channel drivers we do not use (PJSIP, Local and WebSocket only)
noload => chan_iax2.so
noload => chan_dahdi.so
noload => chan_motif.so
noload => chan_unistim.so
noload => chan_console.so
noload => chan_audiosocket.so
noload => chan_rtp.so
noload => res_pjsip_transport_websocket.so

; Codecs other than ulaw (the whole path is G.711 mu-law)
noload => codec_alaw.so
noload => codec_gsm.so
noload => codec_g722.so
noload => codec_g726.so
noload => codec_ilbc.so
noload => codec_lpc10.so
noload => codec_speex.so
noload => codec_adpcm.so
noload => codec_a_mu.so

; CDR/CEL backends: call records are kept by Dograh
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_sqlite3_custom.so
noload => cel_custom.so
noload => cel_manager.so
noload => cel_sqlite3_custom.so

; Misc services that open ports or read external data
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
noload => res_hep.so
noload => res_snmp.so
noload => res_xmpp.so
noload => res_calendar.so
