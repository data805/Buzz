; ARI for Dograh. The section name is the "ARI Username" in Dograh's telephony
; configuration; the password is ARI_PASSWORD (INTERFACES.md).
[general]
enabled = yes
pretty = no
; ARI is used server-to-server only, never from a browser.
allowed_origins =
websocket_write_timeout = 1000

[dograh]
type = user
read_only = no
password = ${ARI_PASSWORD}
password_format = plain
; Defence in depth on top of the bind address and host firewall.
deny = 0.0.0.0/0.0.0.0
permit = ${ARI_PERMIT_CIDRS}
