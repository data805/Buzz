; chan_websocket media connection to Dograh (PLAN.md section 6).
; The section name is the "websocket_client.conf Name" in Dograh (ws_client_name).
; Dograh creates each externalMedia channel with external_host=dograh and appends
; workflow_id, organization_id, workflow_run_id (and token when
; TELEPHONY_WS_TOKEN_ENFORCE is on) through v() transport data, so the URI must
; have no query string. Source: dograh api/services/telephony/ari_manager.py
; _create_external_media(); route api/routes/telephony.py websocket_ari_endpoint()
; accepts the "media" subprotocol.
[dograh]
type = websocket_client
uri = ${DOGRAH_WS_URI}
protocols = media
connection_type = per_call_config
connection_timeout = 1000
reconnect_interval = 500
reconnect_attempts = 4
; Dograh is on loopback (ws://). For a wss:// URI set tls_enabled = yes and
; ca_list_file = /etc/ssl/certs/ca-certificates.crt.
tls_enabled = no
