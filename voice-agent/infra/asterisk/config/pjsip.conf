; Buzz PJSIP: one carrier trunk (zm-trunk) and staff phones for transfers.
; Codec: G.711 mu-law only, end to end (Dograh's externalMedia is ulaw).

[global]
type = global
user_agent = Buzz
endpoint_identifier_order = ip,username
; Never answer OPTIONS/INVITEs from unknown sources with anything useful.
max_forwards = 20

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${ASTERISK_PUBLIC_IP}
external_signaling_address = ${ASTERISK_PUBLIC_IP}
local_net = ${ASTERISK_LAN_CIDR}
local_net = 127.0.0.1/32
tos = cs3
cos = 3

; SIP is accepted only from the carrier and the staff LAN (the host firewall
; is the first line; this is the second).
[acl-sip]
type = acl
deny = 0.0.0.0/0.0.0.0
permit = ${ZM_TRUNK_MATCH}
permit = ${STAFF_LAN_CIDR}
permit = 127.0.0.1/32

; ---------------------------------------------------------------------------
; Carrier trunk. Inbound calls are identified by source IP (ZM_TRUNK_MATCH)
; and land in [from-trunk]. Outbound calls are placed only by [buzz-outbound].
; ---------------------------------------------------------------------------
[zm-trunk]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw
aors = zm-trunk
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
from_domain = ${ZM_TRUNK_FROM_DOMAIN}
trust_id_inbound = yes
send_pai = no
inband_progress = no
timers = yes
allow_transfer = no
allow_subscribe = no

[zm-trunk]
type = aor
contact = sip:${ZM_TRUNK_HOST}:${ZM_TRUNK_PORT}
qualify_frequency = 60

[zm-trunk]
type = identify
endpoint = zm-trunk
match = ${ZM_TRUNK_MATCH}

; Digest auth / registration, generated only if ZM_TRUNK_USERNAME is set.
#include pjsip_trunk_auth.conf

; ---------------------------------------------------------------------------
; Staff phones (transfer targets). Templates only; the endpoints themselves
; live in pjsip_staff.conf (operator-maintained, holds passwords, not in git).
; Staff phones land in [buzz-staff]: they can call the agent DIDs and the echo
; test, never the trunk.
; ---------------------------------------------------------------------------
[staff-endpoint](!)
type = endpoint
transport = transport-udp
context = buzz-staff
disallow = all
allow = ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
allow_transfer = no
allow_subscribe = no

[staff-auth](!)
type = auth
auth_type = digest

[staff-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 60

#include pjsip_staff.conf
