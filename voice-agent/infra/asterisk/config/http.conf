; Asterisk HTTP server: ARI (Dograh) and /metrics (res_prometheus).
; Bound to the buzz-app bridge gateway so only containers on buzz-app can reach it
; (INTERFACES.md). Not reachable from the LAN or the internet.
[general]
enabled = yes
bindaddr = ${ASTERISK_HTTP_BIND}
bindport = ${ASTERISK_HTTP_PORT}
; No prefix: Dograh calls {ARI endpoint}/ari/... directly.
servername = Buzz
enablestatic = no
sessionlimit = 100
session_inactivity = 30000
