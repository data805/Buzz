; Buzz Asterisk core settings. Rendered by entrypoint.sh (no variables used).
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
; astdb lives on its own volume so the image's sounds stay read-only.
astdbdir => /var/lib/asterisk-db
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; The container already runs as the unprivileged "asterisk" user, so no runuser/rungroup.
verbose = 3
debug = 0
maxcalls = 100
maxload = 0.9
; Never let ARI or other external interfaces call dangerous dialplan functions (SHELL, STAT etc.).
live_dangerously = no
hideconnect = yes
transmit_silence = yes
defaultlanguage = en
documentation_language = en_US
