; res_prometheus: metrics at http://${ASTERISK_HTTP_BIND}:${ASTERISK_HTTP_PORT}/metrics
; behind Basic Auth. Served by the same HTTP server as ARI (http.conf).
[general]
enabled = yes
core_metrics_enabled = yes
uri = metrics
auth_username = ${ASTERISK_METRICS_USER}
auth_password = ${ASTERISK_METRICS_PASSWORD}
auth_realm = Buzz Asterisk metrics
