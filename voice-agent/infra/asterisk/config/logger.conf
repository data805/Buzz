; Buzz Asterisk logging.
; console -> container stdout (docker logs, rotated by the json-file driver)
; messages.log -> /var/log/asterisk volume (rotate with "logger rotate", see README)
[general]
dateformat = %F %T.%3q
use_callids = yes
appendhostname = no
rotatestrategy = timestamp

[logfiles]
console => notice,warning,error,verbose(3)
messages.log => notice,warning,error,verbose(3)
security.log => security
