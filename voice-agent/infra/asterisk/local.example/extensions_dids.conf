; Per-DID routing table. Copy to infra/asterisk/local/extensions_dids.conf and edit.
; Not templated. Included by extensions.conf; reached from [from-trunk] and [buzz-staff].
;
; One block per DID. The extension is the number exactly as the carrier sends it
; in the Request-URI (check with "pjsip set logger on" on the first test call;
; carriers differ: 0211123456, 260211123456 or +260211123456).
; BUZZ_AGENT_NUMBER is the address registered as a phone number in Dograh's ARI
; configuration (Telephony configurations > your ARI config > Phone numbers).
; Dograh picks the inbound workflow from it.
;
; Staff phones can test an agent by dialling the short form (e.g. 8000).

[buzz-inbound-dids]
; Front desk (example values - replace)
exten => 211123456,1,Set(BUZZ_AGENT_NUMBER=+260211123456)
 same => n,Goto(buzz-inbound,s,1)
exten => 0211123456,1,Set(BUZZ_AGENT_NUMBER=+260211123456)
 same => n,Goto(buzz-inbound,s,1)
exten => +260211123456,1,Set(BUZZ_AGENT_NUMBER=+260211123456)
 same => n,Goto(buzz-inbound,s,1)

; Internal test number for staff phones
exten => 8000,1,Set(BUZZ_AGENT_NUMBER=+260211123456)
 same => n,Goto(buzz-inbound,s,1)
