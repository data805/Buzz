; Optional transfer target overrides. Copy to infra/asterisk/local/ and edit.
;
; By default Local/<ext>@buzz-transfer/n rings PJSIP/<ext>. Add an extension
; here to ring something else; it must set BUZZ_TARGET and Return().
; Do NOT dial the carrier trunk from here: that would bypass buzz-outbound
; (suppression, hours, channel limit). Staff mobiles are not supported in v1.

[buzz-transfer-targets]
; Ring group: reception (the front-desk agent transfers here)
exten => 2000,1,Set(BUZZ_TARGET=PJSIP/1001&PJSIP/1002)
 same => n,Return()
