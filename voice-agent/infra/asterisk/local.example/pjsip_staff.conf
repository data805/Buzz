; Staff phones. Copy to infra/asterisk/local/pjsip_staff.conf (git-ignored) and
; set real passwords (openssl rand -hex 16). Templates are in pjsip.conf.
; Phones register from STAFF_LAN_CIDR only (acl-sip).

[1001](staff-endpoint)
auth = 1001-auth
aors = 1001
callerid = "Reception" <1001>

[1001-auth](staff-auth)
username = 1001
password = REPLACE-WITH-A-LONG-RANDOM-PASSWORD

[1001](staff-aor)

[1002](staff-endpoint)
auth = 1002-auth
aors = 1002
callerid = "Programmes" <1002>

[1002-auth](staff-auth)
username = 1002
password = REPLACE-WITH-A-LONG-RANDOM-PASSWORD

[1002](staff-aor)
