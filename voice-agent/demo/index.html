<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzz Voice Demo</title>
<link rel="icon" href="/branding/svg/buzz-icon-color.svg">
<style>
  :root{--slate:#364250;--ink:#232c36;--gold:#E8A000;--bg:#f3f4f6;--card:#fff;--line:#e3e6ea;--muted:#6b7683}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(160deg,#e9ecf0,#f8f4e9)}
  .app{width:100%;max-width:560px;height:min(780px,94vh);display:flex;flex-direction:column;background:var(--card);
    border-radius:20px;box-shadow:0 20px 60px rgba(54,66,80,.18);overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--slate);color:#fff}
  header img{height:34px}
  .status{display:flex;align-items:center;gap:8px;font-size:.8rem;color:#cfd6de}
  .dot{width:9px;height:9px;border-radius:50%;background:#4ade80}
  .status.listening .dot{background:var(--gold);animation:pulse 1s infinite}
  .status.speaking .dot{background:#60a5fa;animation:pulse .7s infinite}
  @keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
  #log{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .msg{max-width:82%;padding:10px 14px;border-radius:16px;line-height:1.4;font-size:.96rem;animation:in .2s ease-out;white-space:pre-wrap}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .b{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .u{align-self:flex-end;background:var(--slate);color:#fff;border-bottom-right-radius:4px}
  .err{align-self:center;background:#fdecec;color:#a12;font-size:.85rem}
  .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:16px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{50%{transform:translateY(-5px);opacity:.4}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 18px 0}
  .chips button{border:1px solid var(--line);background:#fff;color:var(--slate);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer}
  .chips button:hover{border-color:var(--gold);color:#8a5d00}
  footer{display:flex;align-items:center;gap:10px;padding:14px 18px}
  #txt{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:999px;font-size:.96rem;outline:none}
  #txt:focus{border-color:var(--gold)}
  .send{border:0;background:var(--slate);color:#fff;border-radius:999px;padding:12px 18px;font-size:.95rem;cursor:pointer}
  #mic{width:50px;height:50px;flex:none;border:0;border-radius:50%;background:var(--gold);color:#fff;cursor:pointer;display:grid;place-items:center}
  #mic svg{width:24px;height:24px;fill:currentColor}
  #mic.on{background:#d33;animation:ring 1.2s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(221,51,51,.5)}100%{box-shadow:0 0 0 16px rgba(221,51,51,0)}}
  button:disabled{opacity:.45;cursor:not-allowed}
  .note{font-size:.72rem;color:var(--muted);text-align:center;padding:0 18px 12px}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="/branding/svg/buzz-logo-horizontal-reverse.svg" alt="Buzz by BongoHive AI Lab">
    <div class="status" id="status"><span class="dot"></span><span id="stext">Ready</span></div>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <footer>
    <button id="mic" title="Talk" aria-label="Talk"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button>
    <form id="form" style="display:contents"><input id="txt" placeholder="Type a message…" autocomplete="off"><button class="send" type="submit">Send</button></form>
  </footer>
  <div class="note">AI assistant demo. Buzz is not a person.</div>
</div>
<script>
const WEBHOOK_URL = "/chat"; // demo/server.py; or paste an n8n webhook URL
const sid = "demo-" + Math.random().toString(36).slice(2);
const $ = id => document.getElementById(id);
const log = $("log"), mic = $("mic"), form = $("form"), txt = $("txt"), status = $("status"), stext = $("stext");
const setStatus = (s, t) => { status.className = "status " + s; stext.textContent = t; };
const add = (cls, t) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = t; log.append(d); log.scrollTop = log.scrollHeight; return d; };

["Where are you?", "What are your opening hours?", "What coworking plans do you have?", "Tell me about your programmes", "I'd like to speak to a person"].forEach(q => {
  const b = document.createElement("button"); b.textContent = q; b.onclick = () => ask(q); $("chips").append(b);
});

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB";
  u.onstart = () => setStatus("speaking", "Speaking"); u.onend = () => setStatus("", "Ready");
  speechSynthesis.speak(u);
}

async function ask(message) {
  add("u", message);
  const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>"; log.append(t); log.scrollTop = log.scrollHeight;
  setStatus("", "Thinking");
  try {
    const r = await fetch(WEBHOOK_URL, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ message, sessionId: sid }) });
    if (!r.ok) throw new Error();
    const { reply } = await r.json();
    t.remove(); add("b", reply || "I did not receive a reply."); if (reply) speak(reply); else setStatus("", "Ready");
  } catch (e) { t.remove(); add("err", "Could not reach the server."); setStatus("", "Offline"); }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR(); rec.lang = "en-GB"; rec.interimResults = false;
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onstart = () => { mic.classList.add("on"); setStatus("listening", "Listening…"); };
  rec.onend = () => { mic.classList.remove("on"); if (stext.textContent === "Listening…") setStatus("", "Ready"); };
  rec.onerror = () => setStatus("", "Ready");
  mic.onclick = () => { speechSynthesis.cancel(); mic.classList.contains("on") ? rec.stop() : rec.start(); };
} else { mic.disabled = true; mic.title = "Use Chrome for voice"; }

form.onsubmit = e => { e.preventDefault(); const v = txt.value.trim(); if (v) { txt.value = ""; ask(v); } };
add("b", "Hello! I'm Buzz from BongoHive. How can I help?");
</script>
</body>
</html>
